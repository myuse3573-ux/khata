services:
  - type: web
    name: khata-backend
    env: node
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: khata-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: khata-postgres
    databaseName: khata_db
    user: khata_user
    plan: free
